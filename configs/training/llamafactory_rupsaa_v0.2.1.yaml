# LLaMA-Factory 0.7.1 CLI config for Rupsaa V0.2.1 — R2 freeze (SFT + QLoRA, FRESH LoRA from base) — NOT RUN.
#   llamafactory-cli train configs/training/llamafactory_rupsaa_v0.2.1.yaml     (from the rupsaa-ai root;
#   owner-started only, after approving data/production/reports/rupsaa_v0.2.1_preparation/PRETRAINING_REPORT.md)
#
# GUI equivalent: bash scripts/start_llamafactory_gui.sh v0.2.1  -> type rupsaa_v0.2.1.yaml, Load arguments.
#
# Dataset: ONLY the R2 freeze data/production/exports/rupsaa_v0.2.1_r2/ (its own dataset_info.json).
# Manifest + SHA-256: data/production/exports/rupsaa_v0.2.1_r2/V021_R2_TRAINING_MANIFEST.json
#   (dataset sha e1332c83…54cd22). R2 supersedes the never-trained first V0.2.1 freeze
#   (5e54c8f2…4e5543, tag rupsaa-v0.2.1-training), which must not be trained.
#   train.jsonl = frozen V0.2 train (1380, unchanged) + 141 corrective x2 + 24 dance x2 = 1710 rows (19.3%)
#   Dance FACTS are served by RAG (knowledge/dance/, 60 owner records); the dance rows teach answer behaviour.
#
# Evaluation during training: LLaMA-Factory 0.7.1 has no separate eval file; val_size 0.05 carves the
# internal eval slice from train.jsonl with datasets.train_test_split(seed=42) -> 1624 train / 86 eval.
# The freeze put ONLY single-copy frozen V0.2 rows at those 86 positions (incl. all 69 of V0.2's own
# internal-eval rows), so no duplicated corrective/dance row is on both sides. External validation/test,
# the 21 corrective and 12 dance held-out cases are never loaded by this config.
#
# Recipe identical to V0.2: Qwen2.5-7B-Instruct base, fresh LoRA r16/a32/d0.05 on all 7 projections,
# 4-bit NF4 + double quant, bf16, gradient checkpointing (LLaMA-Factory default), paged_adamw_8bit,
# lr 2e-4 cosine, warmup 6 (~3%), 2 epochs, batch 2 x accum 8 = 16, cutoff 2048, eval+save every 20,
# best checkpoint by eval_loss.  Expected: 1624 rows -> 812 batches -> 101 steps/epoch -> 202 steps
# (~38-41 min on an NVIDIA L4 at V0.2's 11.4 s/step).
#
# Train-as-serve: every row's system turn is what the runtime sends (V02_SYSTEM_PROMPT + terminology /
# dance block / recall note / language directive where the runtime adds them); serve with
# RUPSAA_PROMPT_VERSION=v0.2 (inferred from the adapter name rupsaa-v0.2.1).

### model
model_name_or_path: Qwen/Qwen2.5-7B-Instruct

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj

### quantization (QLoRA)
quantization_bit: 4
quantization_type: nf4
double_quantization: true
upcast_layernorm: true

### dataset
dataset_dir: data/production/exports/rupsaa_v0.2.1_r2
dataset: rupsaa_v0.2.1_r2_train
val_size: 0.05
template: qwen
cutoff_len: 2048
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: adapters/rupsaa-v0.2.1
overwrite_output_dir: false
logging_steps: 10
save_steps: 20
plot_loss: true
report_to: none

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_steps: 6
weight_decay: 0.0
optim: paged_adamw_8bit
max_grad_norm: 0.3
bf16: true
seed: 42

### eval (best-model retention on eval_loss)
per_device_eval_batch_size: 2
evaluation_strategy: steps
eval_steps: 20
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
