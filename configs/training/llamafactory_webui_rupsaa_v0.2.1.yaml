# Rupsaa V0.2.1 — LLaMA-Factory 0.7.1 **WebUI "Load arguments"** template.
#
# DO NOT point the GUI at this file directly. `bash scripts/start_llamafactory_gui.sh v0.2.1`
# renders it (substituting the project-root placeholder in train.output_dir) into
# config/rupsaa_v0.2.1.yaml on every launch; in the GUI you then type just:   rupsaa_v0.2.1.yaml
#
# Same loading mechanics as the V0.2 template (configs/training/llamafactory_webui_rupsaa_v0.2.yaml).
# Differences from V0.2: dataset rupsaa_v0.2.1_train registered in the V0.2.1 export's own
# dataset_info.json (train.dataset_dir = data/production/exports/rupsaa_v0.2.1 — the "Data dir"
# box), warmup 6, output adapters/rupsaa-v0.2.1.
#
# Same experiment as configs/training/llamafactory_rupsaa_v0.2.1.yaml (CLI). What the GUI does implicitly:
#  * val_size > 0 -> eval_steps = save_steps, load_best_model_at_end = true (webui/runner.py),
#    metric eval_loss; the final adapter is the best checkpoint by eval loss.
#  * 4-bit NF4 + double quantization + gradient checkpointing: LLaMA-Factory defaults.
#  * weight_decay 0.0 and seed 42: trainer defaults — seed 42 is what makes the 84-row internal eval
#    slice land exactly on the single-copy V0.2 rows the freeze placed there.
#  * 196 optimizer steps (98/epoch x 2), save+eval every 20.

top.model_name: Custom
top.model_path: Qwen/Qwen2.5-7B-Instruct
top.finetuning_type: lora
top.quantization_bit: "4"
top.template: qwen

train.training_stage: Supervised Fine-Tuning
train.dataset_dir: data/production/exports/rupsaa_v0.2.1
train.dataset:
  - rupsaa_v0.2.1_train
train.learning_rate: "2e-4"
train.num_train_epochs: "2.0"
train.max_grad_norm: "0.3"
train.max_samples: "100000"
train.compute_type: bf16
train.cutoff_len: 2048
train.batch_size: 2
train.gradient_accumulation_steps: 8
train.val_size: 0.05
train.lr_scheduler_type: cosine
train.logging_steps: 10
train.save_steps: 20
train.warmup_steps: 6
train.optim: paged_adamw_8bit
train.upcast_layernorm: true
train.lora_rank: 16
train.lora_alpha: 32
train.lora_dropout: 0.05
train.lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
train.output_dir: "@RUPSAA_ROOT@/adapters/rupsaa-v0.2.1"
