# RAG (retrieval-augmented generation) configuration.
#
# Embedding model: intfloat/multilingual-e5-small
#   - Small (118M params, ~470MB), fast enough for CPU-only ingestion/query.
#   - Trained for retrieval across 100 languages, with solid Bengali and
#     English coverage — matches Rupsaa's language mix.
#   - E5 models expect "query: " / "passage: " prefixes on inputs; this is
#     handled inside rupsaa/rag/embeddings.py, not left to callers.

embedding_model_id: "intfloat/multilingual-e5-small"
embedding_dim: 384

vector_store:
  backend: "faiss"          # modular: retriever.py only depends on the
  index_dir: "knowledge/index"   # VectorStore interface in vector_store.py
  index_filename: "rupsaa.index"
  metadata_filename: "rupsaa_metadata.jsonl"

chunking:
  chunk_size_chars: 800
  chunk_overlap_chars: 120

retrieval:
  top_k: 4
  # Minimum cosine similarity for a chunk to be considered a real match.
  # Below this, retrieval is treated as "no useful context" rather than
  # forcing irrelevant chunks into the prompt (see rupsaa/rag/pipeline.py).
  min_score: 0.72
  # multilingual-e5 similarity is compressed: casual chat ("Hi Rupsaa, kemon
  # acho?" 0.84) can outscore real knowledge questions ("withdrawal minimum
  # koto?" 0.80) against the same documents, so NO absolute threshold
  # separates them. Relevance is decided mainly by rupsaa/rag/router.py
  # (casual / memory / follow-up messages never retrieve). Within a
  # retrieval, chunks more than relative_margin below the best match are
  # dropped; strict routes also require keyword overlap (pipeline.py).
  relative_margin: 0.04

documents:
  source_dir: "knowledge/documents"
  supported_extensions: [".txt", ".md", ".json", ".pdf"]
